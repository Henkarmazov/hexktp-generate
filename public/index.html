<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Kartu Programmer</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1b2430; --muted: #5d6b7c;
    --line: #d5dce5; --accent: #0e7c86; --accent-dark: #0a5d65; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1520; --card: #14202e; --text: #e6edf5; --muted: #93a3b6;
            --line: #2a3a4d; --accent: #2bb3bf; --accent-dark: #4cc9d4; --err: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .panel h2 { font-size: 1rem; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
  label { display: block; font-size: .8rem; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], select { width: 100%; padding: 9px 10px; border: 1px solid var(--line);
         border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .photo-box { display: flex; gap: 12px; align-items: center; margin-top: 4px; }
  .photo-preview { width: 86px; height: 90px; border: 1px dashed var(--line); border-radius: 8px;
         background: var(--bg) center/cover no-repeat; flex-shrink: 0; display: flex;
         align-items: center; justify-content: center; font-size: .7rem; color: var(--muted); text-align: center; }
  button { font: inherit; cursor: pointer; border-radius: 8px; padding: 11px 16px; border: 0; }
  .primary { background: var(--accent); color: #fff; width: 100%; margin-top: 18px; font-weight: 600; }
  .primary:hover { background: var(--accent-dark); }
  .primary:disabled { opacity: .6; cursor: wait; }
  .secondary { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .error { color: var(--err); margin-top: 12px; font-size: .9rem; min-height: 1.2em; }
  .result-box { display: flex; flex-direction: column; gap: 12px; }
  .result-box img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: none; }
  .placeholder { color: var(--muted); font-size: .9rem; padding: 40px 10px; text-align: center;
         border: 1px dashed var(--line); border-radius: 8px; }
  .dl { display: none; text-align: center; text-decoration: none; background: var(--accent); color: #fff;
        padding: 11px 16px; border-radius: 8px; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Generator Kartu Programmer</h1>
  <p class="sub">Isi data di bawah, upload foto, lalu klik Buat Kartu. Tidak perlu edit file JSON.</p>

  <div class="grid">
    <div class="panel">
      <h2>Data Kartu</h2>
      <form id="f" onsubmit="return false;">
        <div class="row">
          <div><label for="name">Negara (header baris 1)</label>
            <input type="text" id="name" value="INDONESIA"></div>
          <div><label for="next">Kota (header baris 2)</label>
            <input type="text" id="next" value="JAKARTA SELATAN"></div>
        </div>

        <label for="ids">IDS</label>
        <input type="text" id="ids" value="HEN-1919128">

        <label for="nama">Nama</label>
        <input type="text" id="nama" value="Henkarmazov">

        <label for="bio">Bio</label>
        <input type="text" id="bio" value="ingin jadi programer">

        <div class="row">
          <div><label for="jenis_kelamin">Jenis Kelamin</label>
            <select id="jenis_kelamin"><option>Laki-laki</option><option>Perempuan</option></select></div>
          <div><label for="golongan_darah">Gol. Darah</label>
            <select id="golongan_darah"><option>A</option><option>B</option><option>AB</option><option selected>O</option></select></div>
        </div>

        <label for="skil">Skil</label>
        <input type="text" id="skil" value="Fullstack Developer">

        <div class="row">
          <div><label for="html">HTML</label>
            <select id="html" class="lvl"></select></div>
          <div><label for="css">CSS</label>
            <select id="css" class="lvl"></select></div>
        </div>
        <label for="js">JS</label>
        <select id="js" class="lvl"></select>

        <label for="website">Website</label>
        <input type="text" id="website" value="budisantoso.dev">

        <div class="row">
          <div><label for="status">Status Perkawinan</label>
            <input type="text" id="status" value="Sibuk Ngoding"></div>
          <div><label for="pekerjaan">Pekerjaan</label>
            <input type="text" id="pekerjaan" value="Software Engineer"></div>
        </div>

        <div class="row">
          <div><label for="kewarganegaraan">Kewarganegaraan</label>
            <input type="text" id="kewarganegaraan" value="WNI"></div>
          <div><label for="masa_berlaku">Masa Berlaku</label>
            <input type="text" id="masa_berlaku" value="Seumur Hidup"></div>
        </div>

        <div class="row">
          <div><label for="kota">Kota (bawah foto)</label>
            <input type="text" id="kota" value="Jakarta"></div>
          <div><label for="terbuat">Tanggal Dibuat</label>
            <input type="text" id="terbuat"></div>
        </div>

        <label>Pas Foto</label>
        <div class="photo-box">
          <div class="photo-preview" id="preview">Belum ada foto</div>
          <div>
            <input type="file" id="photo" accept="image/*">
            <div style="font-size:.75rem;color:var(--muted);margin-top:4px">JPG/PNG, maks 3 MB. Otomatis dipotong ke rasio pas foto.</div>
          </div>
        </div>

        <button class="primary" id="go" type="button">Buat Kartu</button>
        <div class="error" id="err" role="alert"></div>
      </form>
    </div>

    <div class="panel">
      <h2>Hasil</h2>
      <div class="result-box">
        <div class="placeholder" id="ph">Kartu akan muncul di sini</div>
        <img id="out" alt="Hasil kartu">
        <a class="dl" id="dl" download="kartu-programmer.png">Download PNG</a>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var LEVELS = ["Pemula", "Menengah", "Mahir", "Expert"];
  var DEFAULTS = { html: "Mahir", css: "Mahir", js: "Menengah" };
  var FIELDS = ["name","next","ids","nama","bio","jenis_kelamin","golongan_darah","skil",
                "html","css","js","website","status","pekerjaan","kewarganegaraan",
                "masa_berlaku","kota","terbuat"];
  var photoData = "";

  // isi dropdown level
  ["html","css","js"].forEach(function (id) {
    LEVELS.forEach(function (l) {
      var o = document.createElement("option");
      o.textContent = l; if (l === DEFAULTS[id]) o.selected = true;
      $(id).appendChild(o);
    });
  });

  // tanggal default: hari ini (DD-MM-YYYY)
  var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
  $("terbuat").value = p(d.getDate()) + "-" + p(d.getMonth() + 1) + "-" + d.getFullYear();

  // upload + preview foto
  $("photo").addEventListener("change", function (e) {
    var file = e.target.files[0];
    $("err").textContent = "";
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) {
      $("err").textContent = "Ukuran foto maksimal 3 MB.";
      e.target.value = ""; photoData = ""; return;
    }
    var r = new FileReader();
    r.onload = function () {
      photoData = r.result;
      $("preview").textContent = "";
      $("preview").style.backgroundImage = "url(" + photoData + ")";
    };
    r.readAsDataURL(file);
  });

  $("go").addEventListener("click", function () {
    var err = $("err"); err.textContent = "";
    var payload = {};
    for (var i = 0; i < FIELDS.length; i++) {
      var v = $(FIELDS[i]).value.trim();
      if (!v) { err.textContent = "Semua kolom wajib diisi (" + FIELDS[i] + ")."; $(FIELDS[i]).focus(); return; }
      payload[FIELDS[i]] = v;
    }
    if (!photoData) { err.textContent = "Silakan upload pas foto terlebih dahulu."; return; }
    payload.photo = photoData;

    var btn = $("go"); btn.disabled = true; btn.textContent = "Memproses...";
    fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(function (res) {
      return res.json().then(function (j) { return { ok: res.ok, body: j }; });
    })
    .then(function (r) {
      if (!r.ok) throw new Error(r.body.error || "Gagal membuat kartu");
      $("out").src = r.body.image; $("out").style.display = "block";
      $("dl").href = r.body.image; $("dl").style.display = "block";
      $("ph").style.display = "none";
    })
    .catch(function (e) { err.textContent = e.message; })
    .then(function () { btn.disabled = false; btn.textContent = "Buat Kartu"; });
  });
})();
</script>
</body>
</html>
